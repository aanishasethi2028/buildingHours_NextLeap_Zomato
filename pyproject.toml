[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "zomato-recommender"
version = "0.1.0"
description = "AI-powered restaurant recommendation system (Zomato use case)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0,<3",
    "datasets>=2.14,<4",
    "huggingface_hub>=0.20,<1",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9", "pytest-cov>=4.1,<6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
